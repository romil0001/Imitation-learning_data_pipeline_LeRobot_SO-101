[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101"
version = "0.1.0"
description = "Local SO-101 record, ACT train, eval, and replay"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "romil0001", email = "romil2002modi@gmail.com" },
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
jax = ["jax", "jaxlib", "flax", "optax"]

[tool.setuptools.packages.find]
include = ["so101*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
