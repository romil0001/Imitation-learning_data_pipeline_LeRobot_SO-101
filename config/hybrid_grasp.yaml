# Depth grasp assist for hybrid SmolVLA (or ACT) eval.
# Units: millimeters / degrees. Tune on the robot with wrist depth visible on the dashboard.
enabled: true
roi_frac: 0.3
enter_mm: 180.0
target_mm: 95.0
exit_mm: 280.0
tol_mm: 15.0
min_mm: 40.0
max_mm: 2000.0
gain_deg_per_mm: 0.08
vertical_joints: [shoulder_lift, elbow_flex]
joint_signs:
  shoulder_lift: 1.0
  elbow_flex: 1.0
max_delta_deg: 4.0
close_gripper: true
# From demos: closed gripper sits near ~1 (not 15).
gripper_closed: 2.0
hold_close_frames: 12
# Nearest-depth blob tracking: steer shoulder_pan so the closest cluster
# stays near image center while approaching / grasping.
track_enabled: true
track_roi_frac: 0.7
track_band_mm: 40.0
gain_deg_per_norm: 8.0
lateral_joints: [shoulder_pan]
lateral_signs:
  # If the arm pans the wrong way, flip to -1.0.
  shoulder_pan: 1.0
# Grasp detect: jaw stall OR depth still near target (keys are thin → small residual).
detect_grasp: true
stall_gap: 2.5
gripper_open: 55.0
retry_on_miss: 1
depth_confirm: true
depth_confirm_tol_mm: 40.0
