task: Pick pen and place it next to the keys
timeout_s: 60
n_trials_per_condition: 5
# If omitted, home is the mean of episode state[0] in the eval dataset.
home_steps: 80
home_dt: 0.04
success_criterion: >
  Pen is in the keys zone, gripper is clear of the pen, and nothing was
  knocked over.
conditions:
  - id: pen=left
    pen: left
    lighting: overhead
    distractors: none
    split: id
  - id: pen=center
    pen: center
    lighting: overhead
    distractors: none
    split: id
  - id: pen=right
    pen: right
    lighting: overhead
    distractors: none
    split: id
