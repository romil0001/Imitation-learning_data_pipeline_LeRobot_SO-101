# act25: keep checkpoint temporal ensembling (smooth overlapping chunks) + light EMA.
# n_action_steps is recorded for the launcher; ensemble path replans/blends every step.
# Only reactive (n=1) disables the ensembler.
name: act25
base: act
n_action_steps: 25
async_replan: false
replan_threshold: 25
low_pass_alpha: 0.3
freespace_scale: 1.0
